name: 04 Polskie znaki (ISO-8859-2)
description: >-
  Wysyła przyjęcie z polskimi znakami zakodowane w ISO-8859-2, zgodnie z MSH-18 = 8859/2.
  Gdy bramka zwraca AE albo w jej logu lub w systemie docelowym widać krzaki zamiast ąęłńóśźż,
  kodowanie po stronie bramki jest inne. Wtedy zmień encoding na cp1250 albo utf8 i porównaj.
target:
  host: 127.0.0.1
  port: 2575
  encoding: iso88592
  ackTimeoutMs: 5000
steps:
  - name: ADT^A01 w ISO-8859-2
    send:
      # examples/adt_a01.hl7 deklaruje UTF-8, więc ten krok ma własną kopię z MSH-18 = 8859/2
      message: |
        MSH|^~\&|HIS|SZPITAL_LODZ|BRAMKA|LAB_CENTRALNE|{{now}}||ADT^A01^ADT_A01|{{controlId}}|P|2.5|||AL|NE|PL|8859/2
        EVN|A01|{{now}}||||{{now}}
        PID|1||85010212345^^^SZPITAL_LODZ^PI~85010212345^^^PESEL^NNPOL||Zażółć^Gęślą^Jaźń||19850102|M|||ul. Piotrkowska 104^^Łódź^^90-926^PL||+48 00 000 00 01||||||85010212345|||||||||||N
        NK1|1|Zażółć^Łucja^^^^^L|SPO^Małżonek^HL70063|ul. Piotrkowska 104^^Łódź^^90-926^PL|+48 000 000 004
        PV1|1|I|ODDZ_WEWN^SALA_3^LOZKO_2^SZPITAL_LODZ||||12345^Kowalski^Jan^^^dr n. med.|||WEWN||||1|||12345^Kowalski^Jan||V2026-000123|||||||||||||||||||||||||{{now}}
        DG1|1||I10^Nadciśnienie tętnicze samoistne^ICD10|||A
        AL1|1|DA|^Penicylina||Wysypka skórna
        IN1|1|NFZ^Narodowy Fundusz Zdrowia|NFZ|Narodowy Fundusz Zdrowia||||||||||||Zażółć^Gęślą^Jaźń|SEL|19850102|ul. Piotrkowska 104^^Łódź^^90-926^PL
      autoControlId: true
    expect:
      ack: { msa1: AA, controlIdMatches: true }
