# Runs after a push to master that changes VERSION.md (see the trigger below). Publishes a release
# only when VERSION.md is above the newest v* tag; otherwise every job after "Version" is skipped.
# Then the same files are copied to Mysttic/Mysttic, the public site, under the tag
# simple-hl7-v<version>, and this project's older releases there are removed. Needs the HUB_TOKEN
# secret (see README, "Wydania").
#
# The full CI suite is not repeated here: the pull request from develop into master ran it on this
# very tree (see ci.yml). What does run is a short "Tests" job and the smoke test of each built file,
# and only when a version is actually being published: master is not a protected branch, so a direct
# push can reach this workflow without a pull request, and the "site" job deletes the previous
# release from Mysttic/Mysttic for good.
name: Release

on:
  # Limited to VERSION.md, the only file the "Version" job reads the version from
  # (scripts/release-version.sh):
  # - a push to master that does not touch VERSION.md starts nothing;
  # - a push that edits VERSION.md without raising the number costs the one-minute "Version" job,
  #   everything after it is skipped;
  # - a fix pushed after a failed run (a missing "## [x.y.z]" section in CHANGELOG.md, a broken
  #   build) starts nothing by itself: use "Run workflow" on master, which publishes only while
  #   v<version> does not exist yet. A run that failed after creating the tag (for instance in
  #   "site") is retried with "Re-run failed jobs" instead.
  push:
    branches: [master]
    paths:
      - 'VERSION.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    # Releasing from anything but master would tag an unreviewed commit and replace the site's
    # release. Skipping this job skips every job after it.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      previous: ${{ steps.v.outputs.previous }}
      publishing: ${{ steps.v.outputs.publishing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare VERSION.md with the newest tag
        id: v
        run: |
          set -o pipefail
          sh scripts/release-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Decision
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISHING: ${{ steps.v.outputs.publishing }}
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            echo "Publishing v$VERSION." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "VERSION.md was not raised ($VERSION is already released), nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Tests
    needs: version
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build (${{ matrix.target }})
    needs: [version, test]
    if: needs.version.outputs.publishing == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            file: simple-hl7-*-windows-amd64.exe
          - os: ubuntu-latest
            target: linux-amd64
            file: simple-hl7-*-linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Node SEA builds for the platform it runs on, hence one runner per target. The Linux file
      # carries the official Node binary from nodejs.org, which runs on glibc 2.28 and newer.
      - name: Single executable
        run: node scripts/build-exe.mjs
      - name: Start it in an empty folder and pass one message
        run: node scripts/smoke-exe.mjs dist/${{ matrix.file }}
      # Only the executable travels to the release job, which writes one checksum file for both.
      # One day of retention: the files live on in the release.
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.target }}
          path: dist/${{ matrix.file }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Release on GitHub
    needs: [version, build]
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          chmod +x "simple-hl7-$VERSION-linux-amd64"
          sha256sum "simple-hl7-$VERSION-windows-amd64.exe" "simple-hl7-$VERSION-linux-amd64" > "simple-hl7-$VERSION-checksums.txt"
          cat "simple-hl7-$VERSION-checksums.txt"

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          {
            sh scripts/changelog-section.sh "$VERSION"
            echo
            echo "Pobieranie: https://mysttic.github.io/Mysttic/simple-hl7/"
          } > notes.md
          cat notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(ls -1 dist | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected 3 files in dist (2 executables and the checksums), got $count."
            ls -la dist
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "simple-hl7 $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
          echo "Released $TAG with $count files." >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Copy to the site
    needs: [version, release]
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUB: Mysttic/Mysttic
      PROJECT: simple-hl7
      NAME: simple-hl7
      SITE: https://mysttic.github.io/Mysttic/simple-hl7/
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      HUB_TAG: simple-hl7-v${{ needs.version.outputs.version }}
    steps:
      - name: Credential for the site repository
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${HUB_TOKEN:-}" ]; then
            echo "::error::No HUB_TOKEN secret. Release $TAG was made, the copy to the site was not."
            echo "::error::Needs a personal token with Contents: read and write on $HUB."
            exit 1
          fi

      - name: Files from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p copy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir copy --pattern "$PROJECT-*"
          ls -la copy
          if [ "$(ls -1 copy | wc -l)" -ne 3 ]; then
            echo "::error::Expected three files in release $TAG."
            exit 1
          fi

      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "$NAME $VERSION"
            echo
            echo "$SITE"
          } > notes.md
          cat notes.md

      - name: Release on the site
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$HUB_TAG" --repo "$HUB" >/dev/null 2>&1; then
            gh release delete "$HUB_TAG" --repo "$HUB" --cleanup-tag --yes
          fi
          gh release create "$HUB_TAG" copy/* \
            --repo "$HUB" \
            --title "$NAME $VERSION" \
            --notes-file notes.md \
            --target master

      - name: The site keeps one version
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$HUB" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -E "^$PROJECT-v" || true; } \
            | { grep -vxF "$HUB_TAG" || true; } \
            | while read -r old; do
                echo "Deleting $old"
                gh release delete "$old" --repo "$HUB" --cleanup-tag --yes
              done
          echo "$HUB_TAG stays on the site" >> "$GITHUB_STEP_SUMMARY"
